<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'">
  <title>Kimi 星律挂件</title>
  <link rel="icon" type="image/png" href="../assets/kimi-nyan.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="widget" aria-label="Kimi 娘订阅用量挂件">
    <section id="bubble" class="bubble" aria-label="订阅套餐用量">
      <div class="bubble-stars" aria-hidden="true">✦</div>
      <header class="card-header">
        <div class="brand-mark" aria-hidden="true">K</div>
        <div class="heading">
          <p id="plan-name">Kimi 订阅</p>
          <h1>订阅套餐用量</h1>
        </div>
        <div class="header-actions">
          <button id="refresh-button" class="icon-button" title="刷新用量" aria-label="刷新用量">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg>
          </button>
          <button id="settings-button" class="icon-button" title="设置与同步" aria-label="设置与同步">
            <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg>
          </button>
          <button id="hide-button" class="icon-button" title="收起气泡" aria-label="收起气泡">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </header>

      <div id="usage-view">
        <div class="summary">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
              <defs><linearGradient id="ring-gradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#879ef4"/><stop offset="1" stop-color="#5e57bd"/></linearGradient></defs>
              <circle class="ring-track" cx="60" cy="60" r="49"/>
              <circle id="ring-value" class="ring-value" cx="60" cy="60" r="49"/>
            </svg>
            <div class="ring-text"><strong id="primary-remaining">--</strong><span>剩余</span></div>
          </div>
          <div class="summary-copy">
            <span class="eyebrow">SYMPHONY OF TOKENS</span>
            <h2 id="primary-label">读取用量中</h2>
            <p id="primary-reset">正在唤醒 Kimi 娘…</p>
          </div>
        </div>
        <div id="window-list" class="window-list"></div>
      </div>
      <div id="message-view" class="message-view hidden" aria-live="polite">
        <div class="special-text-window window-list"><p id="message-text"></p></div>
        <div class="plugin-slot"><button id="plugin-entry" class="plugin-entry" title="插件管理">插件</button><div id="plugin-buttons"></div><button id="message-back" class="text-button">返回用量</button></div>
      </div>
      <div class="app-actions" aria-label="应用入口">
        <button id="open-kimi" class="app-button"><span class="app-icon">K</span><span>打开 Kimi</span><span class="app-arrow">↗</span></button>
        <button id="open-kimi-code" class="app-button"><span class="app-icon code-icon">&lt;/&gt;</span><span>打开 Kimi Code</span><span class="app-arrow">↗</span></button>
      </div>
      <footer class="card-footer">
        <span id="source-status">正在读取本地快照</span>
        <button id="sync-button" class="text-button">同步用量</button>
      </footer>
      <div class="bubble-tail" aria-hidden="true"></div>
    </section>

    <section id="settings-panel" class="settings-panel hidden" aria-label="同步与设置">
      <header class="settings-header">
        <div><p>PERSONALIZATION</p><h2>挂件设置</h2></div>
        <button id="settings-close" class="icon-button" aria-label="关闭设置"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>
      <p class="settings-help">用量会自动同步。形象、文案和更多个性化内容可前往本地配置网站调整。</p>
      <form id="usage-form">
        <label class="range-label"><span>挂件大小</span><output id="scale-output">100%</output><input id="scale-input" type="range" min="0.75" max="1.35" step="0.05" value="1"></label>
        <label>按压音效<select id="sound-set-input" class="sound-select"><option value="chime">Kimi 风铃</option><option id="custom-sound-option" value="custom" hidden disabled>自定义音效</option><option value="mute">静音</option></select></label>
        <label class="range-label"><span>音效音量</span><output id="sound-volume-output">70%</output><input id="sound-volume-input" type="range" min="0" max="1" step="0.05" value="0.7"></label>
        <label class="toggle-label"><span>窗口置顶</span><input id="top-input" type="checkbox" checked></label>
        <label class="toggle-label"><span>开机自启</span><input id="startup-input" type="checkbox" checked></label>
        <p id="form-error" class="form-error" role="alert"></p>
        <div class="settings-actions">
          <button id="official-button" type="button" class="primary-button">去个性化</button>
        </div>
      </form>
      <button id="close-widget" class="close-widget">退出桌面挂件</button>
    </section>

    <button id="mascot" aria-label="Kimi 娘，点击显示用量，拖拽移动">
      <span id="mascot-hint">点我看看用量</span>
      <img id="mascot-image" src="../assets/kimi-nyan.png" alt="银白长卷发、深蓝蝴蝶结与星空披肩的 Kimi 娘" draggable="false">
    </button>
  </main>
  <script src="./app.js"></script>
</body>
</html>
